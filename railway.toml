[build]
builder = "RAILPACK"
watchPatterns = [
  "backend/**",
  "requirements.txt",
  "runtime.txt",
  "railpack.json",
  "railway.toml",
]

[deploy]
startCommand = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
